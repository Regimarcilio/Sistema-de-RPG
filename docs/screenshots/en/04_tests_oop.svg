  <text x="80" y="678" fill="#F1F5F9" font-family="Georgia, serif" font-size="20" font-weight="bold">The 4 Pillars of OOP in This Project</text>
  
      <rect x="80" y="698" width="305" height="128" rx="12" fill="#11192B" stroke="#1E293B"/>
      <text x="100" y="732" fill="#FBBF24" font-family="Georgia, serif" font-size="16" font-weight="bold">Abstraction</text>
      <text x="100" y="764" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12.5">Personagem, Item, and IUsavel define</text>
      <text x="100" y="784" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12.5">minimal contracts hiding internals.</text>
    
      <rect x="405" y="698" width="305" height="128" rx="12" fill="#11192B" stroke="#1E293B"/>
      <text x="425" y="732" fill="#FBBF24" font-family="Georgia, serif" font-size="16" font-weight="bold">Encapsulation</text>
      <text x="425" y="764" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12.5">Health, mana, XP, gold, and capacity</text>
      <text x="425" y="784" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12.5">mutate only via validating methods.</text>
    
      <rect x="730" y="698" width="305" height="128" rx="12" fill="#11192B" stroke="#1E293B"/>
      <text x="750" y="732" fill="#FBBF24" font-family="Georgia, serif" font-size="16" font-weight="bold">Inheritance</text>
      <text x="750" y="764" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12.5">Warrior, Mage, Archer, and Monster</text>
      <text x="750" y="784" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12.5">extend Personagem; potions extend Item.</text>
    
      <rect x="1055" y="698" width="305" height="128" rx="12" fill="#11192B" stroke="#1E293B"/>
      <text x="1075" y="732" fill="#FBBF24" font-family="Georgia, serif" font-size="16" font-weight="bold">Polymorphism</text>
      <text x="1075" y="764" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12.5">attack(), specialAbility(), and use()</text>
      <text x="1075" y="784" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12.5">vary per subclass at runtime.</text>
    

