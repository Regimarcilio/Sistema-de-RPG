      <text x="420" y="304" text-anchor="end" fill="#94A3B8" font-family="monospace" font-size="11">INTEGER NOT NULL</text>
    
      <text x="80" y="330" fill="#CBD5E1" font-family="monospace" font-size="11.5" font-weight="bold"></text>
      <text x="116" y="330" fill="#F1F5F9" font-family="monospace" font-size="12">vida</text>
      <text x="420" y="330" text-anchor="end" fill="#94A3B8" font-family="monospace" font-size="11">INTEGER NOT NULL</text>
    
      <text x="80" y="356" fill="#CBD5E1" font-family="monospace" font-size="11.5" font-weight="bold"></text>
      <text x="116" y="356" fill="#F1F5F9" font-family="monospace" font-size="12">mana_max</text>
      <text x="420" y="356" text-anchor="end" fill="#94A3B8" font-family="monospace" font-size="11">INTEGER NOT NULL</text>
    
      <text x="80" y="382" fill="#CBD5E1" font-family="monospace" font-size="11.5" font-weight="bold"></text>
      <text x="116" y="382" fill="#F1F5F9" font-family="monospace" font-size="12">mana</text>
      <text x="420" y="382" text-anchor="end" fill="#94A3B8" font-family="monospace" font-size="11">INTEGER NOT NULL</text>
    
      <text x="80" y="408" fill="#CBD5E1" font-family="monospace" font-size="11.5" font-weight="bold"></text>
      <text x="116" y="408" fill="#F1F5F9" font-family="monospace" font-size="12">forca</text>
      <text x="420" y="408" text-anchor="end" fill="#94A3B8" font-family="monospace" font-size="11">INTEGER NOT NULL</text>
    
      <text x="80" y="434" fill="#CBD5E1" font-family="monospace" font-size="11.5" font-weight="bold"></text>
