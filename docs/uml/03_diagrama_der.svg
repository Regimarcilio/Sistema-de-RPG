<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680">
  <rect width="1440" height="680" fill="#0B1120"/>
  <text x="48" y="46" fill="#F8FAFC" font-family="Georgia, serif" font-size="24" font-weight="bold">Diagrama Entidade-Relacionamento (DER — 3FN)</text>
  <text x="48" y="70" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Modelo relacional normalizado em SQLite (rpg.db) com PRAGMA foreign_keys = ON e exclusão em cascata.</text>
  <line x1="48" y1="86" x2="1392" y2="86" stroke="#1E293B"/>

  <!-- Tabela personagens -->
  <rect x="60" y="130" width="380" height="390" rx="10" fill="#11192B" stroke="#F59E0B" stroke-opacity="0.5"/>
  <rect x="60" y="130" width="380" height="44" rx="10" fill="#0F172A"/>
  <rect x="60" y="164" width="380" height="10" fill="#0F172A"/>
  <text x="80" y="158" fill="#FBBF24" font-family="monospace" font-size="16" font-weight="bold">personagens</text>
  <text x="420" y="158" text-anchor="end" fill="#94A3B8" font-family="monospace" font-size="11">Entidade Forte</text>
  <line x1="60" y1="174" x2="440" y2="174" stroke="#334155"/>

  
      <text x="80" y="200" fill="#FBBF24" font-family="monospace" font-size="11.5" font-weight="bold">PK</text>
      <text x="116" y="200" fill="#F1F5F9" font-family="monospace" font-size="12">id</text>
      <text x="420" y="200" text-anchor="end" fill="#94A3B8" font-family="monospace" font-size="11">INTEGER AUTOINCREMENT</text>
    
      <text x="80" y="226" fill="#38BDF8" font-family="monospace" font-size="11.5" font-weight="bold">UQ</text>
      <text x="116" y="226" fill="#F1F5F9" font-family="monospace" font-size="12">nome</text>
      <text x="420" y="226" text-anchor="end" fill="#94A3B8" font-family="monospace" font-size="11">TEXT NOT NULL UNIQUE</text>
    
      <text x="80" y="252" fill="#CBD5E1" font-family="monospace" font-size="11.5" font-weight="bold"></text>
      <text x="116" y="252" fill="#F1F5F9" font-family="monospace" font-size="12">classe</text>
      <text x="420" y="252" text-anchor="end" fill="#94A3B8" font-family="monospace" font-size="11">TEXT NOT NULL</text>
    
      <text x="80" y="278" fill="#CBD5E1" font-family="monospace" font-size="11.5" font-weight="bold"></text>
      <text x="116" y="278" fill="#F1F5F9" font-family="monospace" font-size="12">nivel</text>
      <text x="420" y="278" text-anchor="end" fill="#94A3B8" font-family="monospace" font-size="11">INTEGER NOT NULL</text>
    
